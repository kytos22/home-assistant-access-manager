name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: node --test tests/test_device_builder_session.cjs
      - run: npm run test:browser
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip==26.1.2
          python -m pip install aiohttp==3.14.1 cryptography==49.0.0 ruamel.yaml==0.19.1 pyyaml esphome==2026.7.0
      - name: Validate Python
        run: python -m py_compile access_manager/app/main.py
      - name: Run registry tests
        run: python -m unittest discover -s tests -v
      - name: Rehearse released registry upgrade and recovery offline
        run: python -B tests/rehearse_upgrade.py --baseline-ref v0.15.3
      - name: Validate UI JavaScript
        run: node tests/check_ui.mjs
      - name: Validate temporary Device Builder session isolation
        run: node --test tests/test_device_builder_session.cjs
      - name: Validate YAML
        run: |
          python - <<'PY'
          import pathlib
          import yaml
          for path in [
              pathlib.Path("repository.yaml"),
              pathlib.Path("access_manager/config.yaml"),
              pathlib.Path("access_manager/translations/en.yaml"),
              pathlib.Path("access_manager/translations/es.yaml"),
          ]:
              yaml.safe_load(path.read_text(encoding="utf-8"))
              print(f"validated {path}")
          PY
      - name: Create CI-only ESPHome secrets
        run: |
          cp esphome/secrets.example.yaml esphome/secrets.yaml
          sed -i 's/CHANGE_ME_WITH_A_BASE64_32_BYTE_KEY/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=/' esphome/secrets.yaml
      - name: Compile display reader firmware
        run: esphome -s name_store_component_source components compile esphome/display-reader.example.yaml
      - name: Compile reader-only firmware
        run: esphome compile esphome/reader-only.example.yaml
      - name: Build add-on image
        run: |
          version=$(python -c 'import yaml; print(yaml.safe_load(open("access_manager/config.yaml"))["version"])')
          docker build \
            --build-arg BUILD_VERSION="$version" \
            --build-arg BUILD_ARCH=amd64 \
            --tag "access-manager-ci:$version" \
            access_manager
