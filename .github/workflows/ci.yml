name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip==26.1.2
          python -m pip install aiohttp==3.14.1 pyyaml
      - name: Validate Python
        run: python -m py_compile access_manager/app/main.py
      - name: Run registry tests
        run: python -m unittest discover -s tests -v
      - name: Validate UI JavaScript
        run: node tests/check_ui.mjs
      - name: Validate YAML
        run: |
          python - <<'PY'
          import pathlib
          import yaml
          for path in [
              pathlib.Path("repository.yaml"),
              pathlib.Path("access_manager/config.yaml"),
              pathlib.Path("access_manager/translations/en.yaml"),
              pathlib.Path("access_manager/translations/es.yaml"),
          ]:
              yaml.safe_load(path.read_text(encoding="utf-8"))
              print(f"validated {path}")
          PY
