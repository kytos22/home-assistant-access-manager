name: "Access Manager"
version: "0.12.2"
slug: "fingerprint_admin"
description: "Local management of users, doors, readers and credentials"
url: "https://github.com/kytos22/home-assistant-access-manager"
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:door-open
panel_title: Access
panel_admin: true
homeassistant_api: true
backup: hot
options:
  log_level: info
schema:
  log_level: "list(warning|info|debug)"
