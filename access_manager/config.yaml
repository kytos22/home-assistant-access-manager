name: "Access Manager"
version: "0.13.1"
slug: "fingerprint_admin"
description: "Local management of users, doors, readers and credentials"
url: "https://github.com/kytos22/home-assistant-access-manager"
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:door-open
panel_title: Access
panel_admin: true
homeassistant_api: true
map:
  - type: homeassistant_config
    read_only: false
backup: hot
options:
  log_level: info
  esphome_dashboard_url: ""
schema:
  log_level: "list(warning|info|debug)"
  esphome_dashboard_url: "str?"
